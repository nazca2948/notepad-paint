<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>メモ帳ペイント</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5ea8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メモ帳">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="tabbar">
    <div class="tabs" id="tabbar"></div>
    <div class="tab-right">
      <span id="status"></span>
      <div class="file-group">
        <button class="file-btn" id="exportBtn" title="このメモをファイルにダウンロード（Ctrl+S）">保存</button>
        <button class="file-btn" id="importBtn" title="保存したファイルを開く（Ctrl+O／ファイルをドロップでも可）">開く</button>
        <input type="file" id="importInput" accept=".npmemo,.json,application/json" hidden>
      </div>
      <button id="toggleDraw">✏ 手書き</button>
    </div>
  </div>

  <div class="textbar" id="textbar">
    <div class="group">
      <span>文字サイズ</span>
      <input type="range" id="fontSize" min="12" max="80" value="19">
      <span id="fontSizeLabel">19px</span>
    </div>
    <div class="group">
      <label><input type="checkbox" id="boldToggle" checked> 太字</label>
    </div>
    <div class="group" title="テキストボックスの文字色">
      <span>文字色</span>
      <button class="tswatch selected" data-color="#1a1a1a" style="background:#1a1a1a;"></button>
      <button class="tswatch" data-color="#2f5ea8" style="background:#2f5ea8;"></button>
      <button class="tswatch" data-color="#b3392c" style="background:#b3392c;"></button>
      <button class="tswatch" data-color="#2f7a4f" style="background:#2f7a4f;"></button>
    </div>
    <div class="group hint">Ctrl+クリック→Wで幅そろえ ／ Ctrl+Lで画像をロック</div>
  </div>

  <div class="inkbar hidden" id="inkbar">
    <div class="group">
      <button class="tool active" data-tool="pen">ペン</button>
      <button class="tool" data-tool="eraser">消しゴム</button>
      <button class="tool" data-tool="line">直線</button>
    </div>
    <div class="group">
      <button class="swatch selected" data-color="#1a1a1a" style="background:#1a1a1a;"></button>
      <button class="swatch" data-color="#2f5ea8" style="background:#2f5ea8;"></button>
      <button class="swatch" data-color="#b3392c" style="background:#b3392c;"></button>
      <button class="swatch" data-color="#2f7a4f" style="background:#2f7a4f;"></button>
    </div>
    <div class="group">
      <span id="sizeLabel">太さ</span>
      <button class="size" data-i="0" title="細い"><i style="width:4px;height:4px;"></i></button>
      <button class="size" data-i="1" title="ふつう"><i style="width:7px;height:7px;"></i></button>
      <button class="size" data-i="2" title="太い"><i style="width:11px;height:11px;"></i></button>
    </div>
    <div class="group">
      <button class="action" id="clearInk">手書き消去</button>
    </div>
    <div class="group">
      <button class="tool" data-tool="grid">グリッド</button>
      <input type="number" id="gridRows" min="1" max="30" value="4" title="行数">
      <span>×</span>
      <input type="number" id="gridCols" min="1" max="30" value="4" title="列数">
    </div>
  </div>

  <div class="editor-wrap" id="wrap">
    <div class="sheet" id="sheet">
      <textarea id="text" spellcheck="false" placeholder=""></textarea>
      <div class="images-layer" id="imagesLayer"></div>
      <canvas id="ink"></canvas>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
