<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>メモ帳ペイント</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5ea8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メモ帳">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:#fff;
    font-family:"Segoe UI","Yu Gothic UI","Meiryo UI",sans-serif;
    overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100%;}

  /* ---- 上部バー：普通のメモ帳っぽく最小限 ---- */
  .topbar{
    display:flex;align-items:center;
    padding:5px 10px;
    background:#f3f3f3;
    border-bottom:1px solid #d9d9d9;
    font-size:13px;
    color:#333;
    user-select:none;
    flex-shrink:0;
  }
  .topbar .title{font-weight:600;color:#444;}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  button#toggleDraw{
    border:1px solid #c9c9c9;
    background:#fff;
    padding:4px 10px;
    border-radius:4px;
    font-size:13px;
    cursor:pointer;
    color:#333;
  }
  button#toggleDraw:hover{background:#eef1fb;}
  button#toggleDraw.active{
    background:#dbe6ff;
    border-color:#7ea3f0;
    color:#1c3f9e;
    font-weight:600;
  }
  #status{font-size:12px;color:#999;min-width:64px;text-align:right;}

  /* ---- タブバー ---- */
  .tabbar{
    display:flex;align-items:flex-end;
    gap:3px;
    padding:5px 8px 0;
    background:#e8e8e6;
    border-bottom:1px solid #d3d3cd;
    overflow-x:auto;
    overflow-y:hidden;
    white-space:nowrap;
    flex-shrink:0;
    user-select:none;
    scrollbar-width:thin;
  }
  .tabbar::-webkit-scrollbar{height:4px;}
  .tab{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 8px 6px 12px;
    font-size:12px;
    color:#666;
    background:#dcdcd8;
    border:1px solid transparent;
    border-bottom:none;
    border-radius:6px 6px 0 0;
    cursor:pointer;
    max-width:150px;
    flex-shrink:0;
  }
  .tab.active{
    background:#fff;
    color:#222;
    border-color:#d3d3cd;
    font-weight:600;
  }
  .tab .tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tab .tab-close{
    flex-shrink:0;
    width:16px;height:16px;
    display:flex;align-items:center;justify-content:center;
    border-radius:3px;
    color:#999;
    opacity:0;
    font-size:13px;
    line-height:1;
  }
  .tab:hover .tab-close, .tab.active .tab-close{opacity:1;}
  .tab .tab-close:hover{background:#e3e3e3;color:#333;}
  .tab-add{
    flex-shrink:0;
    padding:6px 12px;
    margin-bottom:0;
    font-size:15px;
    color:#777;
    cursor:pointer;
    border-radius:6px 6px 0 0;
  }
  .tab-add:hover{background:#d3d3cd;color:#333;}

  /* ---- 手書きモード時だけ出るツールバー ---- */
  .inkbar{
    display:flex;align-items:center;gap:12px;
    height:40px;
    padding:0 10px;
    background:#eef1fb;
    border-bottom:1px solid #c9d3ee;
    font-size:12px;
    flex-shrink:0;
    flex-wrap:nowrap;
    overflow-x:auto;
    white-space:nowrap;
  }
  .inkbar.hidden{display:none;}

  /* ---- 手書きオフ時に出る文字設定バー ---- */
  .textbar{
    display:flex;align-items:center;gap:16px;
    height:40px;
    padding:0 10px;
    background:#f7f7f5;
    border-bottom:1px solid #e2e2dc;
    font-size:12px;
    flex-shrink:0;
    flex-wrap:nowrap;
    overflow-x:auto;
    white-space:nowrap;
    color:#444;
  }
  .textbar.hidden{display:none;}
  .textbar .group{display:flex;align-items:center;gap:6px;flex-shrink:0;height:100%;}
  .textbar input[type=range]{width:120px;}
  .textbar #fontSizeLabel{min-width:34px;display:inline-block;}
  .textbar label{display:flex;align-items:center;gap:5px;cursor:pointer;}
  .textbar .hint{color:#aaa;}
  .inkbar .group{display:flex;align-items:center;gap:6px;flex-shrink:0;height:100%;}
  .inkbar button.tool{
    border:1px solid transparent;
    background:transparent;
    padding:4px 9px;
    border-radius:4px;
    font-size:12px;
    cursor:pointer;
    color:#333;
  }
  .inkbar button.tool:hover{background:#e0e7fb;}
  .inkbar button.tool.active{background:#fff;border-color:#a9bce8;font-weight:600;}
  .swatch{
    width:18px;height:18px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;padding:0;
  }
  .swatch.selected{border-color:#555;}
  .inkbar input[type=range]{width:70px;}
  .inkbar input[type=number]{
    width:40px;
    padding:2px 4px;
    border:1px solid #c3cdec;
    border-radius:4px;
    font-size:12px;
  }
  .inkbar button.action{
    border:1px solid #a9bce8;
    background:#fff;
    padding:4px 9px;
    border-radius:4px;
    font-size:12px;
    cursor:pointer;
  }
  .inkbar button.action:hover{background:#f5f7fd;}
  .inkbar button.action:disabled{opacity:0.4;cursor:default;background:#fff;}

  /* ---- 本体：1枚の紙としてスクロールするエリア ---- */
  .editor-wrap{
    position:relative;
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
  }
  /* .sheet が「紙」そのもの。textarea・画像・canvasはこの中で同じ座標系に重なる */
  .sheet{
    position:relative;
    width:100%;
    /* 高さはJSで内容量に応じて設定（初期値はビューポート分） */
  }
  textarea#text{
    position:absolute;top:0;left:0;
    width:100%;height:100%;
    border:none;outline:none;resize:none;
    padding:10px 14px;
    font-family:"Yu Gothic Bold","Yu Gothic UI Bold","Yu Gothic","Meiryo",sans-serif;
    font-weight:700;
    font-size:19px;
    line-height:1.6;
    color:#111;
    background:transparent;
  }

  /* ---- 貼り付けた画像レイヤー（文字の上、手書きの下） ---- */
  .images-layer{
    position:absolute;top:0;left:0;right:0;
    pointer-events:none;
  }
  .img-box{
    position:absolute;
    pointer-events:auto;
    touch-action:none;
  }
  .img-box img{
    width:100%;height:100%;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
    box-shadow:0 0 0 1px rgba(0,0,0,0.08);
  }
  .img-box.selected img{box-shadow:0 0 0 2px #7ea3f0;}
  .img-box .img-handle{
    position:absolute;right:-7px;bottom:-7px;
    width:14px;height:14px;
    background:#fff;border:2px solid #7ea3f0;border-radius:50%;
    cursor:nwse-resize;
    display:none;
  }
  .img-box.selected .img-handle{display:block;}
  .img-box .img-del{
    position:absolute;top:-10px;right:-10px;
    width:20px;height:20px;
    background:#c0493b;color:#fff;
    border-radius:50%;
    font-size:13px;line-height:20px;text-align:center;
    cursor:pointer;
    display:none;
  }
  .img-box.selected .img-del{display:flex;align-items:center;justify-content:center;}

  canvas#ink{
    position:absolute;top:0;left:0;
    pointer-events:none;
    touch-action:none;
  }
  canvas#ink.draw-pen, canvas#ink.draw-eraser, canvas#ink.draw-line, canvas#ink.draw-grid{cursor:crosshair;pointer-events:auto;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="title">メモ帳</span>
    <div class="right">
      <button id="toggleDraw">✏ 手書き</button>
      <span id="status">読み込み中…</span>
    </div>
  </div>

  <div class="tabbar" id="tabbar"></div>

  <div class="textbar" id="textbar">
    <div class="group">
      <span>文字サイズ</span>
      <input type="range" id="fontSize" min="12" max="80" value="19">
      <span id="fontSizeLabel">19px</span>
    </div>
    <div class="group">
      <label><input type="checkbox" id="boldToggle" checked> 太字</label>
    </div>
    <div class="group hint">画像は Ctrl+V で貼り付け</div>
  </div>

  <div class="inkbar hidden" id="inkbar">
    <div class="group">
      <button class="tool active" data-tool="pen">ペン</button>
      <button class="tool" data-tool="eraser">消しゴム</button>
      <button class="tool" data-tool="line">直線</button>
    </div>
    <div class="group">
      <button class="swatch selected" data-color="#1a1a1a" style="background:#1a1a1a;"></button>
      <button class="swatch" data-color="#2f5ea8" style="background:#2f5ea8;"></button>
      <button class="swatch" data-color="#b3392c" style="background:#b3392c;"></button>
      <button class="swatch" data-color="#2f7a4f" style="background:#2f7a4f;"></button>
    </div>
    <div class="group">
      <span>太さ</span>
      <input type="range" id="width" min="1" max="14" value="3">
    </div>
    <div class="group">
      <button class="action" id="clearInk">手書き消去</button>
    </div>
    <div class="group">
      <button class="tool" data-tool="grid">グリッド</button>
      <input type="number" id="gridRows" min="1" max="30" value="4" title="行数">
      <span>×</span>
      <input type="number" id="gridCols" min="1" max="30" value="4" title="列数">
    </div>
  </div>

  <div class="editor-wrap" id="wrap">
    <div class="sheet" id="sheet">
      <textarea id="text" spellcheck="false" placeholder=""></textarea>
      <div class="images-layer" id="imagesLayer"></div>
      <canvas id="ink"></canvas>
    </div>
  </div>
</div>

<script>
(function(){
  const wrap = document.getElementById('wrap');
  const sheet = document.getElementById('sheet');
  const textEl = document.getElementById('text');
  const canvas = document.getElementById('ink');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const toggleBtn = document.getElementById('toggleDraw');
  const inkbar = document.getElementById('inkbar');
  const textbar = document.getElementById('textbar');
  const fontSizeInput = document.getElementById('fontSize');
  const fontSizeLabel = document.getElementById('fontSizeLabel');
  const boldToggle = document.getElementById('boldToggle');
  const widthInput = document.getElementById('width');
  const gridRowsInput = document.getElementById('gridRows');
  const gridColsInput = document.getElementById('gridCols');
  const tabbarEl = document.getElementById('tabbar');
  const imagesLayerEl = document.getElementById('imagesLayer');

  let drawMode = false;
  let tool = 'pen';
  let currentColor = '#1a1a1a';
  let currentWidth = 3;
  let isDrawing = false;
  let lastX = 0, lastY = 0;
  const undoStack = [];
  const redoStack = [];
  const DPR = window.devicePixelRatio || 1;

  // ---------- 複数メモ（タブ）の状態 ----------
  // 各メモは { id, title, text, ink(dataURL), inkW, inkH, fontSize, bold, images:[{id,x,y,w,h,src}] }
  let notes = [];
  let activeIndex = 0;

  function genId(){
    return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function makeEmptyNote(){
    return {
      id: genId(),
      title: null,
      text: '',
      ink: null, inkW: 0, inkH: 0,
      fontSize: 19,
      bold: true,
      images: []
    };
  }

  // 「紙」の現在の高さ（論理px）。手書き・文字・画像がこの1枚の中で共存し、
  // wrap全体がスクロールすることで、すべてが常に連動して動く。
  let currentSheetHeight = 0;

  // ---------- キャンバス（＝紙）のサイズ変更。既存の絵は伸縮させず、そのままの位置で保持 ----------
  // （同じメモの中でウィンドウ幅や内容量が変わったときに使う。タブ切り替えには使わない）
  function resizeCanvasTo(newW, newH){
    const curLogicalW = canvas.width ? canvas.width / DPR : 0;
    const curLogicalH = canvas.height ? canvas.height / DPR : 0;
    if(Math.round(curLogicalW) === Math.round(newW) && Math.round(curLogicalH) === Math.round(newH)) return;

    let backup = null;
    if(canvas.width > 0 && canvas.height > 0){
      backup = document.createElement('canvas');
      backup.width = canvas.width;
      backup.height = canvas.height;
      backup.getContext('2d').drawImage(canvas, 0, 0);
    }

    canvas.width = newW * DPR;
    canvas.height = newH * DPR;
    canvas.style.width = newW + 'px';
    canvas.style.height = newH + 'px';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(DPR, DPR);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if(backup && curLogicalW > 0 && curLogicalH > 0){
      ctx.drawImage(backup, 0, 0, curLogicalW, curLogicalH);
    }

    currentSheetHeight = newH;
    sheet.style.height = newH + 'px';
  }

  function growCanvasTo(newHeightLogical){
    if(newHeightLogical <= currentSheetHeight) return;
    resizeCanvasTo(wrap.clientWidth, newHeightLogical);
  }

  // タブ切り替え専用：前のメモの絵を引き継がず、まっさらな状態からそのメモのinkを読み込む
  function resetCanvasForNote(note){
    const targetH = Math.max(note.inkH || 0, wrap.clientHeight);
    canvas.width = wrap.clientWidth * DPR;
    canvas.height = targetH * DPR;
    canvas.style.width = wrap.clientWidth + 'px';
    canvas.style.height = targetH + 'px';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(DPR, DPR);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.clearRect(0, 0, wrap.clientWidth, targetH);
    currentSheetHeight = targetH;
    sheet.style.height = targetH + 'px';

    if(note.ink){
      return new Promise((resolve)=>{
        const img = new Image();
        img.onload = ()=>{
          ctx.drawImage(img, 0, 0, note.inkW || wrap.clientWidth, note.inkH || targetH);
          resolve();
        };
        img.onerror = resolve;
        img.src = note.ink;
      });
    }
    return Promise.resolve();
  }

  // テキスト・画像の内容量から必要な高さを測り、足りなければ紙を伸ばす（縮めることはしない）
  function measureAndGrow(){
    const prevHeight = textEl.style.height;
    textEl.style.height = 'auto';
    const contentH = textEl.scrollHeight;
    textEl.style.height = prevHeight || '100%';
    let desired = Math.max(contentH + 20, wrap.clientHeight, currentSheetHeight);
    const note = notes[activeIndex];
    if(note){
      note.images.forEach(im=>{ desired = Math.max(desired, im.y + im.h + 40); });
    }
    growCanvasTo(desired);
    textEl.style.height = '100%';
  }

  function initCanvasSize(){
    resizeCanvasTo(wrap.clientWidth, wrap.clientHeight);
  }
  initCanvasSize();

  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      resizeCanvasTo(wrap.clientWidth, Math.max(currentSheetHeight, wrap.clientHeight));
      measureAndGrow();
    }, 150);
  });

  // ---------- 手書きモードの切り替え ----------
  function setDrawMode(on){
    drawMode = on;
    toggleBtn.classList.toggle('active', on);
    inkbar.classList.toggle('hidden', !on);
    textbar.classList.toggle('hidden', on);
    canvas.classList.toggle('draw-pen', on && tool==='pen');
    canvas.classList.toggle('draw-eraser', on && tool==='eraser');
    canvas.classList.toggle('draw-line', on && tool==='line');
    canvas.classList.toggle('draw-grid', on && tool==='grid');
    textEl.readOnly = on;
    if(on) deselectAllImages();
    if(!on) textEl.focus();
  }
  toggleBtn.addEventListener('click', ()=>setDrawMode(!drawMode));

  document.querySelectorAll('.inkbar button.tool').forEach(b=>{
    b.addEventListener('click', ()=>{
      tool = b.dataset.tool;
      document.querySelectorAll('.inkbar button.tool').forEach(x=>x.classList.toggle('active', x===b));
      canvas.classList.toggle('draw-pen', drawMode && tool==='pen');
      canvas.classList.toggle('draw-eraser', drawMode && tool==='eraser');
      canvas.classList.toggle('draw-line', drawMode && tool==='line');
      canvas.classList.toggle('draw-grid', drawMode && tool==='grid');
    });
  });
  document.querySelectorAll('.swatch').forEach(s=>{
    s.addEventListener('click', ()=>{
      currentColor = s.dataset.color;
      document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));
      s.classList.add('selected');
    });
  });
  widthInput.addEventListener('input', ()=>{ currentWidth = parseInt(widthInput.value,10); });

  // ---------- 文字サイズ・太字 ----------
  function applyFontSize(px){
    textEl.style.fontSize = px + 'px';
    fontSizeLabel.textContent = px + 'px';
  }
  function applyBold(on){
    textEl.style.fontWeight = on ? '700' : '400';
  }
  fontSizeInput.addEventListener('input', ()=>{
    applyFontSize(fontSizeInput.value);
    measureAndGrow();
    scheduleSave();
  });
  boldToggle.addEventListener('change', ()=>{
    applyBold(boldToggle.checked);
    measureAndGrow();
    scheduleSave();
  });

  // ---------- タブ（複数メモ）のUI ----------
  function tabTitle(note, idx){
    if(note.title) return note.title;
    const firstLine = (note.text || '').split('\n')[0].trim();
    if(!firstLine) return `メモ${idx+1}`;
    return firstLine.length > 10 ? firstLine.slice(0,10) + '…' : firstLine;
  }

  function renderTabs(){
    tabbarEl.innerHTML = '';
    notes.forEach((note, i)=>{
      const tab = document.createElement('div');
      tab.className = 'tab' + (i===activeIndex ? ' active' : '');
      tab.dataset.index = i;

      const label = document.createElement('span');
      label.className = 'tab-title';
      label.textContent = tabTitle(note, i);
      tab.appendChild(label);

      const close = document.createElement('span');
      close.className = 'tab-close';
      close.textContent = '×';
      close.title = 'このタブを削除';
      close.addEventListener('click', (e)=>{ e.stopPropagation(); deleteTab(i); });
      tab.appendChild(close);

      tab.addEventListener('click', ()=> switchTab(i));
      tab.addEventListener('dblclick', ()=> renameTab(i));

      tabbarEl.appendChild(tab);
    });

    const addBtn = document.createElement('div');
    addBtn.className = 'tab-add';
    addBtn.textContent = '＋';
    addBtn.title = '新しいメモ';
    addBtn.addEventListener('click', addTab);
    tabbarEl.appendChild(addBtn);
  }

  function updateActiveTabLabel(){
    const el = tabbarEl.querySelector(`.tab[data-index="${activeIndex}"] .tab-title`);
    if(el) el.textContent = tabTitle(notes[activeIndex], activeIndex);
  }

  function renameTab(i){
    const note = notes[i];
    const current = note.title || tabTitle(note, i);
    const name = prompt('タブの名前', current);
    if(name === null) return;
    note.title = name.trim() || null;
    renderTabs();
    scheduleSave();
  }

  function saveActiveNoteState(){
    const note = notes[activeIndex];
    if(!note) return;
    note.text = textEl.value;
    note.fontSize = parseInt(fontSizeInput.value, 10);
    note.bold = boldToggle.checked;
    note.ink = canvas.toDataURL('image/png');
    note.inkW = Math.round(canvas.width / DPR);
    note.inkH = Math.round(canvas.height / DPR);
    // note.images はドラッグ・リサイズのたびに直接更新されているのでここでは不要
  }

  async function loadNoteIntoUI(index){
    const note = notes[index];
    textEl.value = note.text || '';
    fontSizeInput.value = note.fontSize || 19;
    applyFontSize(fontSizeInput.value);
    boldToggle.checked = (note.bold !== false);
    applyBold(boldToggle.checked);
    undoStack.length = 0;
    redoStack.length = 0;

    await resetCanvasForNote(note);
    renderImagesLayer(note);
    measureAndGrow();
    wrap.scrollTop = 0;
  }

  async function switchTab(i){
    if(i === activeIndex) return;
    saveActiveNoteState();
    activeIndex = i;
    await loadNoteIntoUI(activeIndex);
    renderTabs();
    scheduleSave();
  }

  async function addTab(){
    saveActiveNoteState();
    notes.push(makeEmptyNote());
    activeIndex = notes.length - 1;
    await loadNoteIntoUI(activeIndex);
    renderTabs();
    scheduleSave();
    textEl.focus();
  }

  async function deleteTab(i){
    if(notes.length <= 1){
      if(!confirm('最後のタブです。内容をすべて消去しますか？')) return;
      notes[0] = makeEmptyNote();
      activeIndex = 0;
      await loadNoteIntoUI(0);
      renderTabs();
      scheduleSave();
      return;
    }
    if(!confirm('このタブを削除しますか？')) return;
    const deletingActive = (i === activeIndex);
    notes.splice(i, 1);
    if(deletingActive){
      activeIndex = Math.min(i, notes.length - 1);
      await loadNoteIntoUI(activeIndex);
    } else if(i < activeIndex){
      activeIndex -= 1;
    }
    renderTabs();
    scheduleSave();
  }

  // ---------- 貼り付け画像（サイズ調整可能） ----------
  function fileToDataURL(file){
    return new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
  function getImageDims(dataUrl){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=> resolve({ w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = ()=> resolve({ w: 300, h: 200 });
      img.src = dataUrl;
    });
  }

  function renderImagesLayer(note){
    imagesLayerEl.innerHTML = '';
    (note.images || []).forEach(im => createImageBoxEl(im));
  }

  function createImageBoxEl(imgData){
    const box = document.createElement('div');
    box.className = 'img-box';
    box.dataset.id = imgData.id;
    box.style.left = imgData.x + 'px';
    box.style.top = imgData.y + 'px';
    box.style.width = imgData.w + 'px';
    box.style.height = imgData.h + 'px';

    const imgEl = document.createElement('img');
    imgEl.src = imgData.src;
    imgEl.draggable = false;
    box.appendChild(imgEl);

    const delBtn = document.createElement('div');
    delBtn.className = 'img-del';
    delBtn.textContent = '×';
    delBtn.title = '画像を削除';
    delBtn.addEventListener('pointerdown', e=> e.stopPropagation());
    delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); removeImage(imgData.id); });
    box.appendChild(delBtn);

    const handle = document.createElement('div');
    handle.className = 'img-handle';
    box.appendChild(handle);

    box.addEventListener('pointerdown', (e)=>{
      selectImageBox(box);
      if(e.target === handle){
        startResize(e, box, imgData);
      } else if(e.target !== delBtn){
        startMove(e, box, imgData);
      }
    });

    imagesLayerEl.appendChild(box);
    return box;
  }

  function selectImageBox(box){
    deselectAllImages();
    box.classList.add('selected');
  }
  function deselectAllImages(){
    imagesLayerEl.querySelectorAll('.img-box.selected').forEach(b=> b.classList.remove('selected'));
  }
  document.addEventListener('pointerdown', (e)=>{
    if(!e.target.closest || !e.target.closest('.img-box')){
      deselectAllImages();
    }
  }, true);

  function startMove(e, box, imgData){
    e.preventDefault();
    box.setPointerCapture(e.pointerId);
    const startX = e.clientX, startY = e.clientY;
    const origX = imgData.x, origY = imgData.y;
    function onMove(ev){
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      let nx = origX + dx, ny = origY + dy;
      nx = Math.max(0, Math.min(nx, Math.max(0, wrap.clientWidth - imgData.w)));
      ny = Math.max(0, ny);
      imgData.x = nx; imgData.y = ny;
      box.style.left = nx + 'px';
      box.style.top = ny + 'px';
      measureAndGrow();
    }
    function onUp(){
      box.removeEventListener('pointermove', onMove);
      box.removeEventListener('pointerup', onUp);
      scheduleSave();
    }
    box.addEventListener('pointermove', onMove);
    box.addEventListener('pointerup', onUp);
  }

  function startResize(e, box, imgData){
    e.preventDefault();
    e.stopPropagation();
    box.setPointerCapture(e.pointerId);
    const startX = e.clientX, startY = e.clientY;
    const origW = imgData.w, origH = imgData.h;
    const aspect = origW / (origH || 1);
    function onMove(ev){
      const dx = ev.clientX - startX;
      let newW = Math.max(30, origW + dx);
      newW = Math.min(newW, Math.max(30, wrap.clientWidth - imgData.x));
      let newH;
      if(ev.shiftKey){
        const dy = ev.clientY - startY;
        newH = Math.max(30, origH + dy);
      } else {
        newH = newW / aspect;
      }
      imgData.w = newW; imgData.h = newH;
      box.style.width = newW + 'px';
      box.style.height = newH + 'px';
      measureAndGrow();
    }
    function onUp(){
      box.removeEventListener('pointermove', onMove);
      box.removeEventListener('pointerup', onUp);
      scheduleSave();
    }
    box.addEventListener('pointermove', onMove);
    box.addEventListener('pointerup', onUp);
  }

  function removeImage(id){
    const note = notes[activeIndex];
    const idx = note.images.findIndex(im => im.id === id);
    if(idx >= 0) note.images.splice(idx, 1);
    const box = imagesLayerEl.querySelector(`.img-box[data-id="${id}"]`);
    if(box) box.remove();
    scheduleSave();
  }

  async function addImageToNote(dataUrl, dims){
    const wrapW = wrap.clientWidth;
    const maxW = Math.min(wrapW - 40, 480);
    let w = dims.w, h = dims.h;
    if(w > maxW){
      h = h * (maxW / w);
      w = maxW;
    }
    const scrollTop = wrap.scrollTop;
    const x = 20;
    const y = scrollTop + 20;
    const note = notes[activeIndex];
    const imgData = { id: genId(), x, y, w, h, src: dataUrl };
    note.images.push(imgData);
    createImageBoxEl(imgData);
    measureAndGrow();
    selectImageBox(imagesLayerEl.querySelector(`.img-box[data-id="${imgData.id}"]`));
    scheduleSave();
  }

  window.addEventListener('paste', async (e)=>{
    if(!e.clipboardData) return;
    const items = e.clipboardData.items;
    let imageFile = null;
    for(const item of items){
      if(item.kind === 'file' && item.type && item.type.startsWith('image/')){
        imageFile = item.getAsFile();
        break;
      }
    }
    if(!imageFile) return; // 画像でなければ通常のテキスト貼り付けに任せる
    e.preventDefault();
    try{
      const dataUrl = await fileToDataURL(imageFile);
      const dims = await getImageDims(dataUrl);
      await addImageToNote(dataUrl, dims);
    }catch(err){
      console.error('image paste failed', err);
    }
  });

  window.addEventListener('keydown', (e)=>{
    if(e.key === 'Delete' || e.key === 'Backspace'){
      const sel = imagesLayerEl.querySelector('.img-box.selected');
      if(sel && document.activeElement !== textEl){
        e.preventDefault();
        removeImage(sel.dataset.id);
      }
    }
  });

  // ---------- 保存・読み込み（localStorage） ----------
  const STORAGE_KEY = 'notepad-data-v2';
  const LEGACY_KEY = 'notepad-data';
  let saveTimer = null;
  function scheduleSave(){
    statusEl.textContent = '保存中…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSaveAll, 700);
  }
  function doSaveAll(){
    saveActiveNoteState();
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ notes, activeIndex }));
      statusEl.textContent = '保存済み';
    }catch(e){
      console.error('save failed', e);
      statusEl.textContent = '保存エラー（容量不足の可能性）';
    }
  }
  textEl.addEventListener('input', ()=>{
    measureAndGrow();
    updateActiveTabLabel();
    scheduleSave();
  });

  async function loadAll(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const data = JSON.parse(raw);
        if(data && Array.isArray(data.notes) && data.notes.length){
          notes = data.notes.map(n=>({
            id: n.id || genId(),
            title: n.title || null,
            text: n.text || '',
            ink: n.ink || null,
            inkW: n.inkW || 0,
            inkH: n.inkH || 0,
            fontSize: n.fontSize || 19,
            bold: n.bold !== false,
            images: Array.isArray(n.images) ? n.images : []
          }));
          activeIndex = Math.min(Math.max(data.activeIndex || 0, 0), notes.length - 1);
        }
      } else {
        // 旧バージョン（タブなし）のデータがあれば1つ目のタブとして引き継ぐ
        const oldRaw = localStorage.getItem(LEGACY_KEY);
        if(oldRaw){
          const old = JSON.parse(oldRaw);
          notes = [{
            id: genId(), title: null,
            text: old.text || '',
            ink: old.ink || null,
            inkW: old.inkW || 0,
            inkH: old.inkH || 0,
            fontSize: old.fontSize || 19,
            bold: old.bold !== false,
            images: []
          }];
          activeIndex = 0;
        }
      }
    }catch(e){
      console.warn('load failed, starting fresh', e);
    }

    if(notes.length === 0){
      notes = [makeEmptyNote()];
      activeIndex = 0;
    }

    renderTabs();
    await loadNoteIntoUI(activeIndex);
    statusEl.textContent = '保存済み';
  }

  // ---------- 手書きの undo / redo ----------
  function currentSnapshot(){
    return { data: canvas.toDataURL('image/png'), h: currentSheetHeight };
  }
  function pushUndo(){
    undoStack.push(currentSnapshot());
    if(undoStack.length>30) undoStack.shift();
    redoStack.length = 0; // 新しい操作をしたらやり直し履歴は破棄
  }
  function restoreSnapshot(entry, onDone){
    if(entry.h > currentSheetHeight){
      resizeCanvasTo(wrap.clientWidth, entry.h);
    }
    const w = wrap.clientWidth, h = currentSheetHeight;
    const img = new Image();
    img.onload = ()=>{
      ctx.clearRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, entry.h); // 記録時の高さのまま、伸縮させずに描画
      if(onDone) onDone();
    };
    img.src = entry.data;
  }
  function doInkUndo(){
    if(undoStack.length===0) return;
    redoStack.push(currentSnapshot());
    const prev = undoStack.pop();
    restoreSnapshot(prev, ()=>{ scheduleSave(); });
  }
  function doInkRedo(){
    if(redoStack.length===0) return;
    undoStack.push(currentSnapshot());
    const next = redoStack.pop();
    restoreSnapshot(next, ()=>{ scheduleSave(); });
  }

  document.getElementById('clearInk').addEventListener('click', ()=>{
    if(!confirm('手書き部分だけを消去します。よろしいですか？（文字・画像は消えません）')) return;
    pushUndo();
    ctx.clearRect(0,0,wrap.clientWidth,currentSheetHeight);
    scheduleSave();
  });

  // ---------- キーボードショートカット：Ctrl+Z / Ctrl+Y ----------
  // 手書きモード中だけ手書きのUndo/Redoを横取りする。
  // 通常のタイピング中はブラウザ標準のテキストUndo/Redoに任せる（何もしない）。
  window.addEventListener('keydown', (e)=>{
    const ctrlOrCmd = e.ctrlKey || e.metaKey;
    if(!ctrlOrCmd || !drawMode) return;
    const key = e.key.toLowerCase();
    if(key === 'z' && !e.shiftKey){
      e.preventDefault();
      doInkUndo();
    }else if(key === 'y' || (key === 'z' && e.shiftKey)){
      e.preventDefault();
      doInkRedo();
    }
  });

  // ---------- 描画 ----------
  function getPos(e){ return { x: e.offsetX, y: e.offsetY }; }

  // 直線・グリッドツール用：ドラッグ中のプレビュー表示に使う退避キャンバス
  const previewCanvas = document.createElement('canvas');
  const previewCtx = previewCanvas.getContext('2d');
  let dragStartX = 0, dragStartY = 0;

  function snapshotForPreview(){
    previewCanvas.width = canvas.width;
    previewCanvas.height = canvas.height;
    previewCtx.clearRect(0,0,previewCanvas.width,previewCanvas.height);
    previewCtx.drawImage(canvas, 0, 0);
  }
  function restorePreviewBase(){
    const w = wrap.clientWidth, h = currentSheetHeight;
    ctx.clearRect(0,0,w,h);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(previewCanvas, 0, 0, w, h);
  }
  // Shiftキー押下時：水平・垂直・45度に吸着
  function applyAngleSnap(x0, y0, x, y, snap){
    if(!snap) return {x, y};
    const dx = x - x0, dy = y - y0;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const angle = Math.round(Math.atan2(dy, dx) / (Math.PI/4)) * (Math.PI/4);
    return { x: x0 + Math.cos(angle) * dist, y: y0 + Math.sin(angle) * dist };
  }
  // ドラッグした対角線を「1マスの対角線」として、指定した行×列数の正方形グリッドを描く
  function drawGrid(x0, y0, x1, y1){
    const dx = x1 - x0, dy = y1 - y0;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < 3) return; // 小さすぎるドラッグは無視

    const rows = Math.max(1, Math.min(200, parseInt(gridRowsInput.value,10) || 1));
    const cols = Math.max(1, Math.min(200, parseInt(gridColsInput.value,10) || 1));
    const side = dist / Math.SQRT2; // 対角線→正方形の一辺
    const dirX = (x1 >= x0) ? 1 : -1;
    const dirY = (y1 >= y0) ? 1 : -1;

    const left = (dirX > 0) ? x0 : x0 - cols*side;
    const top = (dirY > 0) ? y0 : y0 - rows*side;
    const right = left + cols*side;
    const bottom = top + rows*side;

    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentWidth;
    ctx.beginPath();
    for(let r=0; r<=rows; r++){
      const y = top + side*r;
      ctx.moveTo(left, y); ctx.lineTo(right, y);
    }
    for(let c=0; c<=cols; c++){
      const x = left + side*c;
      ctx.moveTo(x, top); ctx.lineTo(x, bottom);
    }
    ctx.stroke();
  }

  canvas.addEventListener('pointerdown', (e)=>{
    if(!drawMode) return;
    pushUndo();
    isDrawing = true;
    canvas.setPointerCapture(e.pointerId);
    const {x,y} = getPos(e);
    lastX = x; lastY = y;
    if(tool === 'line' || tool === 'grid'){
      dragStartX = x; dragStartY = y;
      snapshotForPreview();
    }
  });
  canvas.addEventListener('pointermove', (e)=>{
    if(!isDrawing) return;
    let {x,y} = getPos(e);

    if(tool === 'line'){
      ({x, y} = applyAngleSnap(dragStartX, dragStartY, x, y, e.shiftKey));
      restorePreviewBase();
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = currentWidth;
      ctx.beginPath();
      ctx.moveTo(dragStartX, dragStartY);
      ctx.lineTo(x, y);
      ctx.stroke();
      return;
    }

    if(tool === 'grid'){
      restorePreviewBase();
      drawGrid(dragStartX, dragStartY, x, y);
      return;
    }

    ctx.globalCompositeOperation = (tool==='eraser') ? 'destination-out' : 'source-over';
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = (tool==='eraser') ? Math.max(currentWidth*4, 14) : currentWidth;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    lastX = x; lastY = y;
  });
  function endStroke(){
    if(!isDrawing) return;
    isDrawing = false;
    scheduleSave();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('pointerleave', ()=>{ if(isDrawing) endStroke(); });

  loadAll();
})();

// ---------- Service Worker登録（オフライン対応） ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>{
      console.warn('Service Worker登録に失敗:', err);
    });
  });
}
</script>
</body>
</html>
